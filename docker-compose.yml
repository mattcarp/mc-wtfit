# WTFIT: app + Postgres. Copy .env.example to .env, fill it in, then:  docker compose up -d --build
name: wtfit
services:
  app:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    env_file: .env
    environment:
      DATABASE_URL: postgres://wtfit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/wtfit
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - photos:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: wtfit
      POSTGRES_DB: wtfit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtfit -d wtfit"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  db:
  photos:
